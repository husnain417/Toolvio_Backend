openapi: 3.1.0
info:
  title: Toolvio Backend API - RBAC & Dynamic Schema System
  version: 1.0.0
  description: |
    Comprehensive API documentation for Toolvio Backend with Role-Based Access Control (RBAC),
    Dynamic Schema Management, Audit Trail, and Multi-tenant Support.
    
    ## 🔐 Authentication
    Most endpoints require JWT authentication. Use the `/api/auth/login` endpoint to get a token,
    then include it in the Authorization header as `Bearer <token>`.
    
    ## 👥 User Roles
    - **Admin**: Full access to all features
    - **Office**: Can manage schemas and data, read audit logs
    - **Technician**: Can read schemas, manage data, read audit logs
    - **Customer**: Can only read data (no schema or audit access)
    
    ## 🏢 Multi-tenant
    All data is isolated by tenant. Users can only access data within their assigned tenant.
    
    Use the "Try it out" button to execute requests against your local server.

servers:
  - url: http://localhost:{port}
    description: Local server
    variables:
      port:
        default: "3000"

paths:
  # Authentication Routes
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with username/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication failed
        '403':
          description: Account locked or tenant inactive

  /api/auth/register:
    post:
      tags: [Authentication]
      summary: User registration
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request data or user already exists
        '403':
          description: Tenant inactive or user limit reached

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh authentication token
      description: Get a new token using current valid token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Token required
        '401':
          description: Invalid or expired token

  /api/auth/profile:
    get:
      tags: [Authentication]
      summary: Get user profile
      description: Retrieve current user's profile information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
        '401':
          description: Authentication required
    put:
      tags: [Authentication]
      summary: Update user profile
      description: Update current user's profile information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: New first name
                lastName:
                  type: string
                  description: New last name
                email:
                  type: string
                  format: email
                  description: New email address
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
        '400':
          description: Invalid request data
        '401':
          description: Authentication required

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change user password
      description: Change current user's password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Invalid request data or incorrect current password
        '401':
          description: Authentication required

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Logout current user (client-side token removal)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Authentication required

  /api/auth/tenant:
    get:
      tags: [Authentication]
      summary: Get tenant information
      description: Retrieve current user's tenant information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantInfo'
                  message:
                    type: string
        '401':
          description: Authentication required
        '404':
          description: Tenant not found

  /api/auth/validate:
    get:
      tags: [Authentication]
      summary: Validate authentication token
      description: Check if current token is valid and return user info
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserProfile'
                  message:
                    type: string
        '401':
          description: Invalid or expired token

  # Schema Management Routes
  /api/schemas:
    get:
      tags: [Schemas]
      summary: Get all schemas
      description: Retrieve all schemas (requires schema read permission)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: active
          schema: { type: boolean }
          description: Only active schemas when true
      responses:
        '200':
          description: List of schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaDefinition'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
    post:
      tags: [Schemas]
      summary: Create new schema
      description: Create a new schema (requires schema write permission + admin/office role)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaDefinitionInput'
            examples:
              basic:
                value:
                  name: product
                  displayName: Product
                  description: Catalog product
                  jsonSchema:
                    type: object
                    properties:
                      name: { type: string }
                      price: { type: number, minimum: 0 }
                    required: [name, price]
      responses:
        '201':
          description: Schema created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/schemas/validate:
    post:
      tags: [Schemas]
      summary: Validate a JSON Schema definition
      description: Validate a JSON Schema (requires schema read permission)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonSchema:
                  type: object
      responses:
        '200': 
          description: Validation result
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/schemas/{name}:
    get:
      tags: [Schemas]
      summary: Get schema by name
      description: Retrieve a specific schema (requires schema read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName_SchemaRoutes'
      responses:
        '200':
          description: Schema details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Schema not found
    put:
      tags: [Schemas]
      summary: Update schema
      description: Update a schema (requires schema write permission + admin/office role)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName_SchemaRoutes'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaUpdateInput'
            examples:
              dummyUpdate:
                summary: Update display and JSON Schema with a valid dummy schema
                value:
                  displayName: Test Offline Sync
                  description: Dummy schema update for testing
                  jsonSchema:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Item name
                      price:
                        type: number
                        minimum: 0
                        description: Item price
                      description:
                        type: string
                        description: Optional description
                    required:
                      - name
                      - price
                    additionalProperties: false
      responses:
        '200': 
          description: Updated schema
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Schema not found
    delete:
      tags: [Schemas]
      summary: Delete schema
      description: Delete a schema (requires schema delete permission + admin role only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName_SchemaRoutes'
      responses:
        '200': 
          description: Schema deleted
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Schema not found

  /api/schemas/{name}/reload:
    post:
      tags: [Schemas]
      summary: Hot reload schema
      description: Hot reload a schema (requires schema write permission + admin/office role)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName_SchemaRoutes'
      responses:
        '200': 
          description: Schema reloaded
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Schema not found

  /api/schemas/{name}/stats:
    get:
      tags: [Schemas]
      summary: Get schema stats
      description: Get statistics for a schema (requires schema read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName_SchemaRoutes'
      responses:
        '200': 
          description: Schema statistics
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Schema not found

  # Dynamic Data Routes
  /api/data/{schemaName}:
    get:
      tags: [Dynamic]
      summary: Get records for schema
      description: Retrieve records for a schema (requires data read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IncludeAudit'
        - $ref: '#/components/parameters/Populate'
      responses:
        '200':
          description: Paginated records
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
    post:
      tags: [Dynamic]
      summary: Create record
      description: Create a new record (requires data write permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              default:
                summary: Example record
                value:
                  name: Smartphone
                  price: 699.99
      responses:
        '201':
          description: Record created
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/data/{schemaName}/count:
    get:
      tags: [Dynamic]
      summary: Get record count
      description: Get count of records (requires data read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
      responses:
        '200': 
          description: Record count
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/data/{schemaName}/stats:
    get:
      tags: [Dynamic]
      summary: Get record statistics
      description: Get statistics for records (requires data read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
      responses:
        '200': 
          description: Record statistics
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/data/{schemaName}/search:
    get:
      tags: [Dynamic]
      summary: Search records
      description: Search records in a schema (requires data read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': 
          description: Search results
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/data/{schemaName}/bulk:
    post:
      tags: [Dynamic]
      summary: Bulk create records
      description: Create multiple records at once (requires data write permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      responses:
        '201': 
          description: Records created
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/data/{schemaName}/{recordId}:
    get:
      tags: [Dynamic]
      summary: Get record by ID
      description: Retrieve a specific record (requires data read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Populate'
      responses:
        '200': 
          description: Record details
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404': 
          description: Record not found
    put:
      tags: [Dynamic]
      summary: Update record by ID
      description: Update a record (requires data write permission). The request body shape follows the target schema. Additional properties are allowed depending on the schema definition.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              validMinimal:
                summary: Minimal valid update that satisfies required fields
                value:
                  name: "Updated Item"
                  price: 199.99
              withOptionalAndExtra:
                summary: Update including optional and additional properties
                value:
                  name: "Updated Item Pro"
                  price: 249.99
                  description: "Now with more features"
                  color: "red"  # example of an additional property if your schema allows it
      responses:
        '200': 
          description: Record updated
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404': 
          description: Record not found
    patch:
      tags: [Dynamic]
      summary: Patch record by ID
      description: Partially update a record (requires data write permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': 
          description: Record updated
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404': 
          description: Record not found
    delete:
      tags: [Dynamic]
      summary: Delete record by ID
      description: Delete a record (requires data delete permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
      responses:
        '200': 
          description: Record deleted
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404': 
          description: Record not found

  # Audit Routes
  /api/audit/{schemaName}/history:
    get:
      tags: [Audit]
      summary: Get schema audit history
      description: Retrieve audit history for a specific schema (requires audit read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit history retrieved
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/audit/{schemaName}/stats:
    get:
      tags: [Audit]
      summary: Get audit statistics
      description: Retrieve audit statistics for a schema (requires audit read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
      responses:
        '200':
          description: Audit statistics retrieved
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/audit/{schemaName}/{recordId}/history:
    get:
      tags: [Audit]
      summary: Get document audit history
      description: Retrieve audit history for a specific document (requires audit read permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Document audit history retrieved
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/audit/{schemaName}/{recordId}/revert/{version}:
    post:
      tags: [Audit]
      summary: Revert document to version
      description: Revert a document to a specific version (requires audit rollback permission)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SchemaName'
        - $ref: '#/components/parameters/RecordId'
        - in: path
          name: version
          required: true
          schema:
            type: integer
          description: Version number to revert to
      responses:
        '200':
          description: Document reverted successfully
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  # System Routes
  /api/system/health:
    get:
      tags: [System]
      summary: Health check
      description: Check system health status
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time

  /api/system/info:
    get:
      tags: [System]
      summary: System information
      description: Get system information summary
      responses:
        '200':
          description: System information summary

  /api/system/stats/database:
    get:
      tags: [System]
      summary: Database statistics
      description: Get database statistics
      responses:
        '200':
          description: Database stats

  /api/system/stats/api:
    get:
      tags: [System]
      summary: API statistics
      description: Get API usage statistics
      responses:
        '200':
          description: API stats

  /api/system/init:
    post:
      tags: [System]
      summary: Initialize system services
      description: Initialize system services and components
      responses:
        '200':
          description: Initialization result

  /api/system/logs:
    get:
      tags: [System]
      summary: System logs
      description: Get recent system logs
      responses:
        '200':
          description: Recent logs

  # Offline Sync Routes
  /api/sync/changes:
    get:
      tags: [Sync]
      summary: Get changes since last sync
      description: Retrieve incremental changes since a specific sync version
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: since
          required: true
          schema:
            type: number
          description: Last known global sync version
        - in: query
          name: deviceId
          required: true
          schema:
            type: string
          description: Unique device identifier
        - in: query
          name: schemas
          schema:
            type: string
          description: Specific schemas to sync (comma-separated)
        - in: query
          name: limit
          schema:
            type: number
            default: 1000
          description: Maximum number of changes to return
        - in: query
          name: includeDeleted
          schema:
            type: boolean
            default: true
          description: Include tombstone records
      responses:
        '200':
          description: Changes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  changes:
                    type: array
                    items:
                      type: object
                  schemaVersions:
                    type: object
                  currentGlobalVersion:
                    type: number
                  currentTenantVersion:
                    type: number
                  syncMetadata:
                    type: object
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized

  /api/sync/batch:
    post:
      tags: [Sync]
      summary: Process batch of client changes
      description: Process multiple client changes in a single request
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSyncRequest'
      responses:
        '200':
          description: Changes processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  processedChanges:
                    type: number
                  syncDuration:
                    type: number
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized

  /api/sync/state:
    get:
      tags: [Sync]
      summary: Get client sync state
      description: Retrieve current sync state for a device
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: deviceId
          required: true
          schema:
            type: string
          description: Unique device identifier
      responses:
        '200':
          description: Sync state retrieved successfully
        '400':
          description: Missing deviceId parameter
        '401':
          description: Unauthorized
        '404':
          description: Sync state not found

    post:
      tags: [Sync]
      summary: Create or update client sync state
      description: Initialize or update client sync state with preferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSyncState'
      responses:
        '200':
          description: Sync state created/updated successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized

  /api/sync/conflicts:
    get:
      tags: [Sync]
      summary: Get conflicted changes
      description: Retrieve all conflicted changes for manual resolution
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: schemas
          schema:
            type: string
          description: Specific schemas to check for conflicts (comma-separated)
      responses:
        '200':
          description: Conflicted changes retrieved successfully
        '401':
          description: Unauthorized

  /api/sync/health:
    get:
      tags: [Sync]
      summary: Get sync system health
      description: Retrieve overall sync system health and statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync health information retrieved successfully
        '401':
          description: Unauthorized

  # Tenant Management Routes
  /api/tenants:
    post:
      tags: [Tenants]
      summary: Create a new tenant
      description: Create a new tenant with the specified configuration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantResponse'
                  message:
                    type: string
        '400':
          description: Invalid request data or tenant already exists
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
    get:
      tags: [Tenants]
      summary: Get all tenants
      description: Retrieve all tenants with pagination, filtering, and sorting
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search term for name, display name, or tenant ID
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by tenant status
        - in: query
          name: plan
          schema:
            type: string
            enum: [trial, basic, professional, enterprise]
          description: Filter by subscription plan
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
          description: Field to sort by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        '200':
          description: Tenants retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tenants:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantResponse'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: number
                          limit:
                            type: number
                          total:
                            type: number
                          pages:
                            type: number
                  message:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions

  /api/tenants/summary:
    get:
      tags: [Tenants]
      summary: Get tenants summary
      description: Get a simplified list of active tenants for dropdowns and selection
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenants summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: string
                        name:
                          type: string
                        displayName:
                          type: string
                        subscriptionPlan:
                          type: string
                  message:
                    type: string
        '401':
          description: Authentication required

  /api/tenants/{tenantId}:
    get:
      tags: [Tenants]
      summary: Get tenant by ID
      description: Retrieve a specific tenant by its ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
          description: Tenant identifier
      responses:
        '200':
          description: Tenant retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantResponse'
                  message:
                    type: string
        '401':
          description: Authentication required
        '404':
          description: Tenant not found
    put:
      tags: [Tenants]
      summary: Update tenant
      description: Update an existing tenant's information
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
          description: Tenant identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantResponse'
                  message:
                    type: string
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Tenant not found
    delete:
      tags: [Tenants]
      summary: Delete tenant (soft delete)
      description: Deactivate a tenant (soft delete - sets isActive to false)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
          description: Tenant identifier
      responses:
        '200':
          description: Tenant deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantResponse'
                  message:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Tenant not found

  /api/tenants/{tenantId}/status:
    patch:
      tags: [Tenants]
      summary: Toggle tenant status
      description: Activate or deactivate a tenant
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
          description: Tenant identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
                  description: Whether to activate or deactivate the tenant
                  example: true
      responses:
        '200':
          description: Tenant status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantResponse'
                  message:
                    type: string
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Tenant not found

  /api/tenants/{tenantId}/stats:
    get:
      tags: [Tenants]
      summary: Get tenant statistics
      description: Retrieve usage statistics and limits for a specific tenant
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: tenantId
          required: true
          schema:
            type: string
          description: Tenant identifier
      responses:
        '200':
          description: Tenant statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantStats'
                  message:
                    type: string
        '401':
          description: Authentication required
        '404':
          description: Tenant not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


      description: JWT token from /api/auth/login endpoint

  parameters:
    SchemaName:
      in: path
      name: schemaName
      required: true
      schema: { type: string }
      description: Dynamic schema name
    SchemaName_SchemaRoutes:
      in: path
      name: name
      required: true
      schema: { type: string }
      description: Schema name (for schema routes)
    RecordId:
      in: path
      name: recordId
      required: true
      schema: { type: string }
      description: Record identifier
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Sort:
      in: query
      name: sort
      schema: { type: string }
      description: 'JSON string of sort object. Example: {"createdAt": -1}'
    IncludeAudit:
      in: query
      name: includeAudit
      schema: { type: boolean, default: false }
    Populate:
      in: query
      name: populate
      schema: { type: string }
      description: Comma-separated fields to populate (references)

  schemas:
    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - identifier
        - password
        - tenantId
      properties:
        identifier:
          type: string
          description: Username or email address
          example: "admin"
        password:
          type: string
          description: User password
          example: "admin123456"
        tenantId:
          type: string
          description: Tenant identifier
          example: "test-tenant"

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - firstName
        - lastName
        - tenantId
      properties:
        username:
          type: string
          description: Unique username
          example: "john.doe"
        email:
          type: string
          format: email
          description: User email address
          example: "john.doe@example.com"
        password:
          type: string
          minLength: 8
          description: User password (minimum 8 characters)
          example: "securePassword123"
        firstName:
          type: string
          description: User's first name
          example: "John"
        lastName:
          type: string
          description: User's last name
          example: "Doe"
        role:
          type: string
          enum: [admin, office, technician, customer]
          default: customer
          description: User role
          example: "technician"
        tenantId:
          type: string
          description: Tenant identifier
          example: "test-tenant"

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: Current password
          example: "currentPassword123"
        newPassword:
          type: string
          minLength: 8
          description: New password (minimum 8 characters)
          example: "newPassword123"

    RefreshTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Current JWT token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserProfile:
      type: object
      properties:
        _id:
          type: string
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        role:
          type: string
          enum: [admin, office, technician, customer]
          description: User role
        tenantId:
          type: string
          description: Tenant ID
        permissions:
          type: object
          description: User permissions
        lastLogin:
          type: string
          format: date-time
          description: Last login timestamp
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp

    TenantInfo:
      type: object
      properties:
        _id:
          type: string
          description: Tenant ID
        tenantId:
          type: string
          description: Tenant identifier
        name:
          type: string
          description: Tenant name
        displayName:
          type: string
          description: Display name
        description:
          type: string
          description: Tenant description
        subscriptionPlan:
          type: string
          enum: [trial, basic, professional, enterprise]
          description: Subscription plan
        subscriptionStatus:
          type: string
          description: Current subscription status
        settings:
          type: object
          description: Tenant settings
        usage:
          type: object
          description: Usage statistics

    # Sync-related schemas
    SyncRequest:
      type: object
      required:
        - deviceId
        - since
      properties:
        deviceId:
          type: string
          description: Unique device identifier
          example: "iphone_12_pro_max_12345"
        since:
          type: number
          description: Last known global sync version
          example: 1000
        schemas:
          type: array
          items:
            type: string
          description: Optional specific schemas to sync
          example: ["products", "orders"]
        limit:
          type: number
          description: Maximum number of changes to return
          example: 1000
        includeDeleted:
          type: boolean
          description: Include tombstone records
          default: true

    ClientChange:
      type: object
      required:
        - operation
        - schema
        - data
        - clientTimestamp
      properties:
        operation:
          type: string
          enum: [create, update, delete]
          description: Type of operation
        schema:
          type: string
          description: Schema name
          example: "products"
        recordId:
          type: string
          description: Record ID (required for update/delete)
          example: "507f1f77bcf86cd799439011"
        data:
          type: object
          description: Record data
        clientTimestamp:
          type: string
          format: date-time
          description: When client made the change
        clientVersion:
          type: string
          description: Client app version
          example: "1.2.3"

    BatchSyncRequest:
      type: object
      required:
        - deviceId
        - clientSyncVersion
        - changes
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        clientSyncVersion:
          type: number
          description: Client's current sync version
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ClientChange'
        conflictResolution:
          type: object
          properties:
            strategy:
              type: string
              enum: [server_wins, client_wins, manual, smart_merge]
              default: smart_merge
            manualResolutions:
              type: array
              items:
                type: object
                properties:
                  changeId:
                    type: string
                  resolution:
                    type: object

    ClientSyncState:
      type: object
      required:
        - deviceId
        - appVersion
        - platform
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        appVersion:
          type: string
          description: Client app version
        platform:
          type: string
          enum: [ios, android, web, desktop]
          description: Client platform
        syncIntervalMinutes:
          type: number
          description: Sync interval in minutes
          default: 15
        connectionType:
          type: string
          enum: [wifi, cellular, ethernet, unknown]
          description: Network connection type
        networkQuality:
          type: string
          enum: [excellent, good, fair, poor]
          description: Network quality assessment
        preferences:
          type: object
          properties:
            autoSync:
              type: boolean
              default: true
            syncOnWifiOnly:
              type: boolean
              default: false
            maxBatchSize:
              type: number
              default: 1000
            conflictResolution:
              type: string
              enum: [server_wins, client_wins, manual, smart_merge]
              default: smart_merge

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Operation success status
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'
            token:
              type: string
              description: JWT authentication token
        message:
          type: string
          description: Response message

    # Schema Schemas
    SchemaDefinition:
      type: object
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        collectionName: { type: string }
        isActive: { type: boolean }
        jsonSchema:
          type: object
    SchemaDefinitionInput:
      type: object
      required: [name, displayName, jsonSchema]
      properties:
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        jsonSchema:
          type: object
          description: JSON Schema for this entity
    SchemaUpdateInput:
      type: object
      properties:
        displayName: { type: string }
        description: { type: string }
        jsonSchema: { type: object }

    TenantCreate:
      type: object
      required:
        - tenantId
        - name
        - displayName
      properties:
        tenantId:
          type: string
          description: Unique tenant identifier
          example: "acme-corp"
        name:
          type: string
          description: Company/organization name
          example: "Acme Corporation"
        displayName:
          type: string
          description: Display name for the tenant
          example: "Acme Corp"
        description:
          type: string
          description: Tenant description
          example: "Leading technology solutions provider"
        contactEmail:
          type: string
          format: email
          description: Primary contact email
          example: "admin@acme.com"
        contactPhone:
          type: string
          description: Primary contact phone
          example: "+1-555-0123"
        settings:
          type: object
          properties:
            maxUsers:
              type: number
              description: Maximum number of users allowed
              example: 100
            maxSchemas:
              type: number
              description: Maximum number of schemas allowed
              example: 50
            maxStorageGB:
              type: number
              description: Maximum storage in GB
              example: 10
        subscriptionPlan:
          type: string
          enum: [trial, basic, professional, enterprise]
          default: trial
          description: Subscription plan
          example: "professional"

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
          description: Company/organization name
        displayName:
          type: string
          description: Display name for the tenant
        description:
          type: string
          description: Tenant description
        contactEmail:
          type: string
          format: email
          description: Primary contact email
        contactPhone:
          type: string
          description: Primary contact phone
        settings:
          type: object
          properties:
            maxUsers:
              type: number
              description: Maximum number of users allowed
            maxSchemas:
              type: number
              description: Maximum number of schemas allowed
            maxStorageGB:
              type: number
              description: Maximum storage in GB
        subscriptionPlan:
          type: string
          enum: [trial, basic, professional, enterprise]
          description: Subscription plan

    TenantResponse:
      type: object
      properties:
        _id:
          type: string
          description: Tenant ID
        tenantId:
          type: string
          description: Unique tenant identifier
        name:
          type: string
          description: Company/organization name
        displayName:
          type: string
          description: Display name for the tenant
        description:
          type: string
          description: Tenant description
        contactEmail:
          type: string
          description: Primary contact email
        contactPhone:
          type: string
          description: Primary contact phone
        settings:
          type: object
          properties:
            maxUsers:
              type: number
              description: Maximum number of users allowed
            maxSchemas:
              type: number
              description: Maximum number of schemas allowed
            maxStorageGB:
              type: number
              description: Maximum storage in GB
            features:
              type: object
              properties:
                auditTrail:
                  type: boolean
                  description: Audit trail feature enabled
                changeStreams:
                  type: boolean
                  description: Change streams feature enabled
                offlineSync:
                  type: boolean
                  description: Offline sync feature enabled
                apiRateLimit:
                  type: boolean
                  description: API rate limiting enabled
        subscriptionPlan:
          type: string
          description: Subscription plan
        isActive:
          type: boolean
          description: Whether tenant is active
        isTrial:
          type: boolean
          description: Whether tenant is in trial period
        trialExpiresAt:
          type: string
          format: date-time
          description: Trial expiration date
        createdAt:
          type: string
          format: date-time
          description: Tenant creation date
        updatedAt:
          type: string
          format: date-time
          description: Last update date

    TenantStats:
      type: object
      properties:
        tenantId:
          type: string
          description: Tenant identifier
        name:
          type: string
          description: Tenant name
        displayName:
          type: string
          description: Display name
        subscriptionPlan:
          type: string
          description: Subscription plan
        isActive:
          type: boolean
          description: Active status
        usage:
          type: object
          properties:
            userCount:
              type: number
              description: Current number of users
            schemaCount:
              type: number
              description: Current number of schemas
            storageUsedGB:
              type: number
              description: Storage used in GB
            maxUsers:
              type: number
              description: Maximum users allowed
            maxSchemas:
              type: number
              description: Maximum schemas allowed
            maxStorageGB:
              type: number
              description: Maximum storage allowed
        limits:
          type: object
          properties:
            userLimitReached:
              type: boolean
              description: User limit reached
            schemaLimitReached:
              type: boolean
              description: Schema limit reached
            storageLimitReached:
              type: boolean
              description: Storage limit reached

