version: '3.8'

services:
  # Main application
  app:
    build: .
    container_name: craftsman-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/toolivo?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    depends_on:
      - mongo
      - redis
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    networks:
      - craftsman-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB with replica set
  mongo:
    image: mongo:6.0
    container_name: craftsman-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - craftsman-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for queues
  redis:
    image: redis:7-alpine
    container_name: craftsman-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - craftsman-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: craftsman-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - craftsman-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MongoDB replica set initialization
  mongo-init:
    image: mongo:6.0
    container_name: craftsman-mongo-init
    restart: "no"
    depends_on:
      - mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host mongo:27017 -u admin -p password123 --authenticationDatabase admin --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"mongo:27017\" }
            ]
          });
        ' &&
        echo 'Replica set initialized'
      "
    networks:
      - craftsman-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  craftsman-network:
    driver: bridge

# Health check for the entire stack
x-healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 60s
